name: CloudBox Runtime Model Eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact OpenAI model name or pinned model snapshot
        required: true
        type: string
      repeat:
        description: Attempts per Canary case
        required: true
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  runtime-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Runtime Eval suite
        run: python scripts/validate_runtime_evals.py
      - name: Require API key
        run: test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY repository secret is missing" && exit 1)
      - name: Run Canary model Evals
        run: |
          mkdir -p artifacts
          python scripts/run_runtime_evals.py \
            --model "${{ inputs.model }}" \
            --repeat "${{ inputs.repeat }}" \
            --output artifacts/runtime-eval.jsonl
      - name: Grade Canary model Evals
        run: |
          python scripts/grade_runtime_evals.py \
            --input artifacts/runtime-eval.jsonl \
            --output artifacts/runtime-eval-summary.json
      - name: Upload Runtime Eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudbox-runtime-eval-${{ github.run_id }}
          path: |
            artifacts/runtime-eval.jsonl
            artifacts/runtime-eval-summary.json
          if-no-files-found: warn
          retention-days: 30
