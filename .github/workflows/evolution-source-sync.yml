name: CloudBox Evolution Source Sync

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Logical source ID from the private registry
        required: true
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate source contracts
        run: python scripts/validate_evolution_source_sync.py
      - name: Synchronize configured source
        env:
          EVOLUTION_SOURCE_URL: ${{ secrets.EVOLUTION_SOURCE_URL }}
          EVOLUTION_EXCHANGE_URL: ${{ secrets.EVOLUTION_EXCHANGE_URL }}
          EVOLUTION_SOURCE_ID: ${{ github.event.inputs.source_id || secrets.EVOLUTION_SOURCE_ID }}
        run: |
          test -n "$EVOLUTION_SOURCE_URL"
          test -n "$EVOLUTION_EXCHANGE_URL"
          test -n "$EVOLUTION_SOURCE_ID"
          mkdir -p .cloudbox-skills .local
          python - <<'PY'
          import json, os, re
          source_id = os.environ["EVOLUTION_SOURCE_ID"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", source_id):
              raise SystemExit("invalid source identifier")
          registry = {"schema_version": "1.0", "sources": [{"source_id": source_id, "url_secret": "EVOLUTION_SOURCE_URL", "ref": "HEAD"}]}
          with open(".cloudbox-skills/evolution-sources.private.json", "w", encoding="utf-8") as stream:
              json.dump(registry, stream)
          PY
          if ! git clone --quiet "$EVOLUTION_EXCHANGE_URL" .local/private-evolution-exchange 2>/dev/null; then
            echo "Private Eval Exchange clone failed; remote details redacted" >&2
            exit 1
          fi
          python scripts/cloudbox_skills_evolution.py source sync \
            --registry .cloudbox-skills/evolution-sources.private.json \
            --exchange .local/private-evolution-exchange \
            --source-id "$EVOLUTION_SOURCE_ID"
          git -C .local/private-evolution-exchange config user.name "CloudBox Evolution Sync"
          git -C .local/private-evolution-exchange config user.email "cloudbox-sync@example.invalid"
          git -C .local/private-evolution-exchange add sources
          if ! git -C .local/private-evolution-exchange diff --cached --quiet; then
            git -C .local/private-evolution-exchange commit -m "sync evolution source $EVOLUTION_SOURCE_ID"
            if ! git -C .local/private-evolution-exchange push 2>/dev/null; then
              echo "Private Eval Exchange push failed; remote details redacted" >&2
              exit 1
            fi
          fi
