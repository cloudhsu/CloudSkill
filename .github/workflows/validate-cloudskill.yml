name: Validate CloudSkill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run CloudSkill checks
        run: python scripts/run_all_checks.py
      - name: Verify generated files are committed
        run: git diff --exit-code
